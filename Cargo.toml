[workspace]
resolver = "3"
members = ["crates/hc-proto", "crates/hc-tui", "crates/hc-vt"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
hc-proto = { path = "crates/hc-proto" }
hc-vt = { path = "crates/hc-vt" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
